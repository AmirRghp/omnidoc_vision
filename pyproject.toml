[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnidoc-vision"
version = "0.1.0"
description = "Multimodal Document Intelligence & Visual RAG for Complex Engineering PDFs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "OmniDoc-Vision Engineering Team" }
]
dependencies = [
    "docling>=2.15.0",
    "pypdf>=5.0.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.2.0",
    "matplotlib>=3.9.0",
    "Pillow>=10.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "qdrant-client>=1.11.0",
    "FlagEmbedding>=1.3.0",
    "bm25s>=0.2.0",
    "numpy>=1.26.0",
    "langgraph>=0.2.0",
    "openai>=1.45.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "chainlit>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".agents",
    ".venv",
    "data",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src", "evals"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = false

[[tool.mypy.overrides]]
module = [
    "docling.*",
    "pdfplumber.*",
    "reportlab.*",
    "matplotlib.*",
    "FlagEmbedding.*",
    "bm25s.*",
    "qdrant_client.*",
    "chainlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
