name: OmniDoc-Vision CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Tests & Package Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Mypy static type checker
        run: |
          mypy src
          mypy --strict src scripts evals

      - name: Generate deterministic benchmark PDFs & dataset
        run: python scripts/build_benchmark_pdfs.py

      - name: Run unit and integration test suite
        run: pytest -v

      - name: Verify wheel package build
        run: python -m pip wheel . --no-deps -w dist
